controls:
  - name: steer-max-guests
    description: Guide agent to split booking when guests exceed maximum of 10 per room
    enabled: true
    execution: sdk
    scope:
      step_types:
        - llm
      stages:
        - post
    selector:
      path: output
    evaluator:
      name: regex
      config:
        pattern: "(1[1-9]|[2-9]\\d)\\s*guest"
    action:
      decision: steer
      message: Guest count exceeds maximum of 10 per room
      steering_context:
        message: >
          The booking exceeds the hotel maximum of 10 guests per room, so it must be
          split into two rooms. Do NOT restate the original total. Immediately call
          book_hotel twice: first with guests=10, then with guests=5. After both calls
          succeed, report the two booking confirmation IDs returned by the tool and tell
          the user their reservation was split into two rooms (10 + 5 guests).
    tags:
      - booking
      - steer
      - capacity
